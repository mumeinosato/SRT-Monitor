name: ci

# push だけで動かす。pull_request でも動かすと、同じコミットを2回ビルドするうえ、
# PR の実行はフィーチャーブランチの push が作ったキャッシュを引き継げず、
# gotk4(cgo)を一からコンパイルし直す(約10分)。
# チェック結果は同じコミットに付くので、PR の画面にはこの実行の結果が出る。
on:
  push:
    branches: ["**"]
    tags: ["v*"]   # v0.1.0 のようなタグでリリースを作る
  workflow_dispatch:

# 同じブランチへ続けて push したら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 成果物の名前に使う版。タグならタグ名、それ以外は dev-<コミット>
  VER: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}

jobs:
  # cgo なし(GTK 不要)の版の検査。速い(依存の取得だけで、数分以内)。
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make fetch-mediamtx
      - name: T1 go vet(cgo なし)
        run: CGO_ENABLED=0 go vet ./...
      - name: T1 go test(cgo なし)
        run: CGO_ENABLED=0 go test ./...

  # cgo なしの版を、3つの CPU 向けにクロスビルドする(実験版)。
  lite:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64, suffix: amd64 }
          - { goarch: arm, suffix: armv7 }
          - { goarch: arm64, suffix: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: ビルド(${{ matrix.goarch }})
        run: make build-lite GOARCH=${{ matrix.goarch }} GOARM=7
      - name: パッケージ作成
        run: scripts/package.sh "srtrx-${VER}-lite-linux-${{ matrix.suffix }}" "bin/lite-${{ matrix.goarch }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-lite-${{ matrix.suffix }}
          path: dist/

  # 本番向けの既定の版(GTK4、cgo)。gotk4 のコンパイルが長いので、キャッシュが効かないと約10分かかる。
  gtk:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # gotk4(cgo)のビルドに GTK4 と gobject-introspection の開発ファイルが要る。
      - name: apt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-4-dev libgirepository1.0-dev pkg-config
      - run: make fetch-mediamtx
      - name: go vet(GTK 版)
        run: go vet -tags gtk ./...
      - name: ビルド(GTK 版)
        run: make build
      - name: パッケージ作成
        run: scripts/package.sh "srtrx-${VER}-linux-amd64" bin dist
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-gtk-amd64
          path: dist/

  # v* のタグのときだけ、全部のパッケージを集めて、リリースを1回だけ作る。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lite, gtk]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: GitHub Release を作成(あれば、ファイルを上書きで添付して、説明文を更新)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          files=(dist/*.tar.gz dist/*.tar.gz.sha256)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # 画面などで先にリリースが作られていても失敗しない
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "srtrx $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "srtrx $GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes
          fi
