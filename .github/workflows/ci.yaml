name: ci

# push だけで動かす。pull_request でも動かすと、同じコミットを2回ビルドするうえ、
# PR の実行はフィーチャーブランチの push が作ったキャッシュを引き継げず、
# gotk4(cgo)を一からコンパイルし直す(約10分)。
# チェック結果は同じコミットに付くので、PR の画面にはこの実行の結果が出る。
on:
  push:
    branches: ["**"]
    tags: ["v*"]   # v0.1.0 のようなタグでリリースを作る
  workflow_dispatch:

# 同じブランチへ続けて push したら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # リリースの作成に必要(タグのときだけ使う)
    steps:
      - uses: actions/checkout@v4

      # Go のビルドキャッシュ(gotk4 のcgoコンパイル結果を含む)を go.sum をキーに保存・復元する
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gotk4(cgo)のビルドに GTK4 と gobject-introspection の開発ファイルが要る。
      # テストは GUI を開かず、ffmpeg も要らない(自己診断のテストは偽の ffmpeg を使う)。
      - name: apt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-4-dev libgirepository1.0-dev pkg-config

      # MediaMTX の公式バイナリを取得して SHA-256 を検証する(以降の make は取得済みとして飛ばす)
      - run: make fetch-mediamtx

      - name: T1 go vet
        run: go vet ./...

      - name: T1 go test
        run: go test ./...

      - name: T1 make build
        run: make build

      - uses: actions/upload-artifact@v4
        with:
          name: srtrx-linux-amd64
          path: bin/

      # ---- リリース(v* のタグを push したときだけ) ----
      - name: パッケージ作成
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="srtrx-${GITHUB_REF_NAME}-linux-amd64"
          mkdir -p "dist/$name"
          cp bin/srtrx bin/srtrx-player "dist/$name/"
          cp deploy/srtrx.service deploy/srtrx-player.service "dist/$name/"
          cp README.md "dist/$name/"
          cp internal/mediamtx/LICENSE "dist/$name/LICENSE-mediamtx"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: GitHub Release を作成
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="srtrx-${GITHUB_REF_NAME}-linux-amd64"
          cat > notes.md <<'EOF'
          ## 動作環境
          - Ubuntu 24.04 LTS (x86_64) でビルド。GTK 4.10 以上(ビルドは 4.14.5)
          - ffmpeg 6.0 以上(**libsrt 有効**のビルド)。起動時に自己診断します
          - MediaMTX は `srtrx` に埋め込み済み(公式バイナリ、MIT。`LICENSE-mediamtx` を同梱)

          ## 入れ方
          ```bash
          tar xzf srtrx-*-linux-amd64.tar.gz && cd srtrx-*-linux-amd64
          install -Dm755 srtrx srtrx-player -t ~/.local/bin
          install -Dm644 srtrx.service srtrx-player.service -t ~/.config/systemd/user
          systemctl --user daemon-reload
          systemctl --user enable --now srtrx-player.service srtrx.service
          ```
          EOF
          files=("dist/$name.tar.gz" "dist/$name.tar.gz.sha256")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # 画面などで先にリリースが作られていたら、ファイルを上書きで添付し、説明文も更新する
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "srtrx $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "srtrx $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
          fi
